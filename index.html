<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>公司打卡</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
         background: #f4f6f8; color: #1f2937; padding: 16px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .site { background: #e8f5f0; color: #0f6e56; border-radius: 10px; padding: 12px 14px;
          font-size: 16px; font-weight: bold; margin-bottom: 14px; }
  .site.field { background: #fff4e0; color: #b45309; }
  label { font-size: 13px; color: #374151; display: block; margin: 12px 0 6px; }
  textarea, select, input { width: 100%; border: 1px solid #d1d5db; border-radius: 10px; padding: 12px;
             font-size: 15px; font-family: inherit; background: #fff; }
  select { height: 48px; }
  .gps { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: #f3f4f6;
         color: #4b5563; margin: 14px 0; }
  .gps.ok { background: #e8f5f0; color: #0f6e56; }
  .gps.err { background: #fdecea; color: #b91c1c; }
  .btns { display: flex; gap: 12px; margin-top: 18px; }
  .btns button { flex: 1; border: none; border-radius: 12px; padding: 18px 0; font-size: 18px;
                 font-weight: bold; color: #fff; font-family: inherit; }
  .in { background: #1d9e75; } .out { background: #d97706; }
  button:disabled { opacity: .5; }
  .result { margin-top: 16px; padding: 14px; border-radius: 10px; font-size: 15px;
            text-align: center; display: none; }
  .result.show { display: block; }
  .result.good { background: #e8f5f0; color: #0f6e56; }
  .result.bad { background: #fdecea; color: #b91c1c; }
  .who { font-size: 12px; color: #9ca3af; text-align: center; margin-top: 14px; }
  .makeup { margin-top: 20px; padding-top: 16px; border-top: 1px dashed #d1d5db; }
  .mk-title { font-size: 14px; color: #6b7280; margin-bottom: 10px; }
  .makeup select, .makeup input { margin-bottom: 10px; }
  .mkbtn { width: 100%; background: #6b7280; color: #fff; border: none; border-radius: 10px; padding: 14px 0; font-size: 15px; font-weight: bold; font-family: inherit; }
  .mkbtn:disabled { opacity: .5; }

  .date { color: #6b7280; font-size: 13px; margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .stat { background: #fff; border-radius: 10px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .stat b { display: block; font-size: 22px; font-weight: bold; }
  .stat span { font-size: 11px; color: #6b7280; }
  .stat.warn b { color: #d97706; } .stat.bad b { color: #b91c1c; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  .arow { background: #fff; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .muted { color: #6b7280; font-size: 12px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .tag.ok { background: #e8f5f0; color: #0f6e56; }
  .tag.bad { background: #fdecea; color: #b91c1c; }
  .tag.wait { background: #fff4e0; color: #b45309; }
  .pend { border-left: 3px solid #f59e0b; }
  .pbtns { display: flex; gap: 8px; margin-top: 10px; }
  .pbtns button { flex: 1; border: none; border-radius: 8px; padding: 10px 0; font-size: 14px; font-weight: bold; color: #fff; font-family: inherit; }
  .approve { background: #1d9e75; } .reject { background: #d97706; }
  .refresh { width: 100%; border: 1px solid #d1d5db; background: #fff; border-radius: 10px; padding: 12px; font-size: 14px; font-family: inherit; margin-top: 8px; }
  .empty { color: #9ca3af; font-size: 13px; padding: 8px 0; }
  .uid { font-family: monospace; font-size: 12px; background: #f3f4f6; padding: 8px; border-radius: 6px; word-break: break-all; margin: 8px 0; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  .sitegrp { margin-bottom: 10px; }
  table.att { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border-radius: 8px; overflow: hidden; }
  table.att th, table.att td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: center; }
  table.att th { background: #f1f5f9; }
  table.att td.nm { text-align: left; }
  table.att tr.miss td { color: #b91c1c; }
  #siteFilter { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="card"><div class="sub" id="boot">載入中…</div></div></div>

<template id="punchTpl">
  <div class="card">
    <h1>公司打卡</h1>
    <div class="sub" id="who"></div>
    <label>打卡位置</label>
    <select id="siteSel"><option>載入中…</option></select>
    <div id="otherWrap" style="display:none">
      <label>地點／事由（必填）</label>
      <input id="otherReason" placeholder="例：送件市政府 / 拜訪業主">
    </div>
    <div class="gps" id="gps">定位中…</div>
    <label>備註（選填）</label>
    <input id="note" placeholder="例：交通延誤，遲到 10 分">
    <div class="btns">
      <button class="in" id="btnIn" disabled>上班</button>
      <button class="out" id="btnOut" disabled>下班</button>
    </div>
    <div class="result" id="result"></div>
  </div>
</template>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  var LIFF_ID = "2011018188-xd2VsV0A";
  var GAS_URL = "https://script.google.com/macros/s/AKfycbydMPZ2v8XYeV_5-L8GKV5CjS21j9Z_9g3_8CBZHWgb0Bx09bBrRUG7Y9vN_1K2oWk/exec";

  var P = getParams();
  var me = { userId: '', displayName: '' };
  var pos = { lat: null, lng: null };

  function getParams() {
    var p = new URLSearchParams(location.search);
    var o = { site: p.get('site'), name: p.get('name'), mode: p.get('mode'), view: p.get('view') };
    if (!o.site && !o.mode && !o.view && p.get('liff.state')) {
      var st = new URLSearchParams(p.get('liff.state').replace(/^\?/, ''));
      o = { site: st.get('site'), name: st.get('name'), mode: st.get('mode'), view: st.get('view') };
    }
    return { site: o.site || '', name: o.name || '', mode: o.mode || '', view: o.view || '' };
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }); }
  function post(body) {
    return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login(); return; }
    return liff.getProfile();
  }).then(function (p) {
    if (!p) return;
    me.userId = p.userId; me.displayName = p.displayName;
    me.idToken = liff.getIDToken();
    if (P.view === 'admin') { startAdmin(); return; }
    post({ action: 'whoami', idToken: me.idToken }).then(function (w) {
      if (w && w.ok && !w.bound) startBind(w);
      else if (P.view === 'makeup') startMakeup();
      else startPunch();
    }).catch(function () { if (P.view === 'makeup') startMakeup(); else startPunch(); });
  }).catch(function (e) {
    document.getElementById('boot').textContent = '初始化失敗：' + e;
  });

  var sitesData = [], sitesDone = false, gpsDone = false, userPicked = false, punchCtx = {};

  function startBind(w) {
    var opts = '';
    (w.unbound || []).forEach(function (e) { opts += '<option value="' + esc(e.id) + '">' + esc(e.name + (e.dept ? '（' + e.dept + '）' : '')) + '</option>'; });
    var html = '<div class="card"><h1>首次設定</h1>' +
      '<div class="sub">歡迎 ' + esc(w.lineName) + '！請選擇你的姓名完成綁定，之後打卡就會自動認得你。</div>';
    if (!opts) {
      document.getElementById('wrap').innerHTML = html +
        '<div class="gps err">名冊中查無可綁定的員工，請聯絡管理員把你加入「員工名冊」後再試。</div></div>';
      return;
    }
    html += '<label>你的姓名</label><select id="bindSel">' + opts + '</select>' +
      '<div class="btns"><button class="in" id="bindBtn">確認綁定</button></div>' +
      '<div class="result" id="bindMsg"></div></div>';
    document.getElementById('wrap').innerHTML = html;
    document.getElementById('bindBtn').onclick = function () {
      var empId = document.getElementById('bindSel').value;
      document.getElementById('bindBtn').disabled = true;
      post({ action: 'bind', idToken: me.idToken, empId: empId }).then(function (res) {
        var m = document.getElementById('bindMsg');
        if (!res || !res.ok) { document.getElementById('bindBtn').disabled = false; m.className = 'result show bad'; m.textContent = (res && res.msg) || '綁定失敗'; return; }
        m.className = 'result show good'; m.textContent = '綁定成功：' + res.name + '，即將進入打卡…';
        me.displayName = res.name;
        setTimeout(startPunch, 1200);
      }).catch(function (e) {
        document.getElementById('bindBtn').disabled = false;
        var m = document.getElementById('bindMsg'); m.className = 'result show bad'; m.textContent = '綁定失敗：' + e;
      });
    };
  }

  function startPunch() {
    var tpl = document.getElementById('punchTpl').content.cloneNode(true);
    var w = document.getElementById('wrap'); w.innerHTML = ''; w.appendChild(tpl);
    document.getElementById('who').textContent = '打卡人：' + me.displayName;
    document.getElementById('siteSel').addEventListener('change', function () { userPicked = true; updateOther(); });
    document.getElementById('btnIn').onclick = function () { punch('上班'); };
    document.getElementById('btnOut').onclick = function () { punch('下班'); };
    locate();
    loadSites();
  }

  function startMakeup() {
    var nowD = new Date();
    var t = ('0' + nowD.getHours()).slice(-2) + ':' + ('0' + nowD.getMinutes()).slice(-2);
    document.getElementById('wrap').innerHTML = '<div class="card"><h1>補打卡</h1>' +
      '<div class="sub">打卡人：' + esc(me.displayName) + '（限當天，需直屬主管核准）</div>' +
      '<label>類型</label><select id="mkType"><option value="上班">上班補打</option><option value="下班">下班補打</option></select>' +
      '<label>時間</label><input type="time" id="mkTime" value="' + t + '">' +
      '<label>補打原因（必填）</label><input id="mkReason" placeholder="例：忘記打上班卡">' +
      '<div class="btns"><button class="in" id="mkBtn">送出補打申請</button></div>' +
      '<div class="result" id="result"></div></div>';
    document.getElementById('mkBtn').onclick = makeup;
  }

  function makeup() {
    var type = document.getElementById('mkType').value;
    var time = document.getElementById('mkTime').value;
    var reason = document.getElementById('mkReason').value.trim();
    if (!time) { alert('請選補打時間'); return; }
    if (!reason) { alert('請填補打原因'); return; }
    document.getElementById('mkBtn').disabled = true;
    post({ action: 'makeup', idToken: me.idToken, punchType: type, makeupTime: time, reason: reason, device: navigator.platform + ' / LINE' })
      .then(function (res) {
        document.getElementById('mkBtn').disabled = false;
        if (!res || !res.ok) { showResult(false, (res && res.msg) || '補打失敗'); return; }
        showResult(true, '補打申請已送出（' + type + '補打 ' + res.time + '），待主管核准');
        setTimeout(function () { if (window.liff && liff.closeWindow) liff.closeWindow(); }, 2200);
      }).catch(function (e) { document.getElementById('mkBtn').disabled = false; showResult(false, '送出失敗：' + e); });
  }

  function loadSites() {
    post({ action: 'sites' }).then(function (res) { sitesData = (res && res.sites) || []; sitesDone = true; buildOptions(); })
      .catch(function () { sitesDone = true; buildOptions(); });
  }

  function jsDist(la1, ln1, la2, ln2) {
    var R = 6371000, tr = Math.PI / 180;
    var dLa = (la2 - la1) * tr, dLn = (ln2 - ln1) * tr;
    var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) + Math.cos(la1 * tr) * Math.cos(la2 * tr) * Math.sin(dLn / 2) * Math.sin(dLn / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function buildOptions() {
    var sel = document.getElementById('siteSel');
    if (!sel || !sitesDone) return;
    var nearestIdx = -1, best = Infinity;
    if (pos.lat != null) sitesData.forEach(function (s, i) {
      s._d = jsDist(pos.lat, pos.lng, s.lat, s.lng); if (s._d < best) { best = s._d; nearestIdx = i; }
    });
    var prev = userPicked ? sel.value : null;
    var html = '';
    sitesData.forEach(function (s, i) {
      var suffix = (i === nearestIdx) ? '（最近 ' + Math.round(s._d) + 'm）' : (s._d != null ? '（' + Math.round(s._d) + 'm）' : '');
      html += '<option value="' + esc(s.code) + '">' + esc(s.name + suffix) + '</option>';
    });
    html += '<option value="__other__">其他（外勤，自行輸入）</option>';
    sel.innerHTML = html;
    if (prev) sel.value = prev;
    else if (P.site) sel.value = P.site;
    else if (nearestIdx >= 0) sel.selectedIndex = nearestIdx;
    updateOther();
    if (gpsDone) ready();
  }

  function updateOther() {
    document.getElementById('otherWrap').style.display =
      (document.getElementById('siteSel').value === '__other__') ? 'block' : 'none';
  }
  function findSiteByCode(c) { for (var i = 0; i < sitesData.length; i++) if (sitesData[i].code === c) return sitesData[i]; return null; }

  function setGps(txt, cls) { var el = document.getElementById('gps'); if (el) { el.textContent = txt; el.className = 'gps' + (cls ? ' ' + cls : ''); } }
  function ready() { document.getElementById('btnIn').disabled = false; document.getElementById('btnOut').disabled = false; }
  function locate() {
    if (!navigator.geolocation) { setGps('此裝置不支援定位，仍可打卡', 'err'); gpsDone = true; buildOptions(); return; }
    navigator.geolocation.getCurrentPosition(function (r) {
      pos.lat = r.coords.latitude; pos.lng = r.coords.longitude; setGps('✓ 已取得定位', 'ok'); gpsDone = true; buildOptions();
    }, function (err) { setGps('未取得定位（' + err.message + '）', 'err'); gpsDone = true; buildOptions(); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
  }

  function punch(type) {
    var sel = document.getElementById('siteSel');
    var isOther = (sel.value === '__other__');
    var reason = isOther ? document.getElementById('otherReason').value.trim() : '';
    if (isOther && !reason) { alert('請輸入地點／事由'); return; }
    var note = document.getElementById('note').value.trim();
    var site = '', siteName = '';
    if (!isOther) { var s = findSiteByCode(sel.value); site = s ? s.code : sel.value; siteName = s ? s.name : ''; }
    punchCtx = { type: type, note: note };
    document.getElementById('btnIn').disabled = true; document.getElementById('btnOut').disabled = true;
    post({ idToken: me.idToken, userId: me.userId, displayName: me.displayName, mode: isOther ? 'field' : '', site: site, siteName: siteName,
           punchType: type, lat: pos.lat, lng: pos.lng, reason: reason, note: note, device: navigator.platform + ' / LINE' })
      .then(onDone).catch(function (e) { showResult(false, '送出失敗：' + e); ready(); });
  }

  function onDone(res) {
    if (!res || !res.ok) { showResult(false, (res && res.msg) || '打卡失敗'); ready(); return; }
    var okStatus = (res.status === '正常' || res.status === '待核准');
    var t = '打卡成功　' + res.time;
    if (res.status === '待核准') t = '外勤已送出，待主管核准';
    else if (res.status !== '正常') t = '已記錄，定位異常（' + res.status + '）';
    else if (res.distance !== '') t += '（距工地 ' + res.distance + ' 公尺）';
    showResult(okStatus, t);
    sendCard(res).then(function () { setTimeout(function () { if (window.liff && liff.closeWindow) liff.closeWindow(); }, 1500); });
  }

  function sendCard(res) {
    try {
      if (!liff.isInClient()) return Promise.resolve();
      var ctx = liff.getContext();
      if (!ctx || ctx.type === 'external' || ctx.type === 'none') return Promise.resolve();
      return liff.sendMessages([buildFlex(res)]).catch(function () {});
    } catch (e) { return Promise.resolve(); }
  }

  function buildFlex(res) {
    var good = (res.status === '正常'), wait = (res.status === '待核准');
    var color = good ? '#1d9e75' : (wait ? '#d97706' : '#b91c1c');
    var title = good ? '✅ 打卡成功' : (wait ? '⏳ 外勤待核准' : '⚠️ 打卡（定位異常）');
    function line(k, v) {
      return { type: 'box', layout: 'baseline', spacing: 'sm', contents: [
        { type: 'text', text: k, size: 'sm', color: '#999999', flex: 2 },
        { type: 'text', text: String(v == null || v === '' ? '-' : v), size: 'sm', color: '#333333', flex: 5, wrap: true }] };
    }
    var body = [
      { type: 'text', text: title, weight: 'bold', size: 'lg', color: color },
      { type: 'separator', margin: 'md' },
      line('姓名', me.displayName), line('類型', punchCtx.type)];
    if (res.empSiteName) body.push(line('工地別', res.empSiteName));
    body.push(line('打卡地點', res.siteName), line('時間', res.time));
    if (res.distance !== '' && res.distance != null) body.push(line('距離', res.distance + ' 公尺'));
    if (punchCtx.note) body.push(line('備註', punchCtx.note));
    return { type: 'flex', altText: title + ' ' + me.displayName,
      contents: { type: 'bubble', size: 'kilo', body: { type: 'box', layout: 'vertical', spacing: 'sm', contents: body } } };
  }

  function showResult(good, txt) { var el = document.getElementById('result'); el.textContent = txt; el.className = 'result show ' + (good ? 'good' : 'bad'); }

  function startAdmin() { loadDashboard(); }
  function loadDashboard() {
    document.getElementById('wrap').innerHTML = '<div class="card"><div class="sub">載入後台…</div></div>';
    post({ action: 'dashboard', idToken: me.idToken }).then(renderAdmin)
      .catch(function (e) { document.getElementById('wrap').innerHTML = '<div class="card">讀取失敗：' + esc(e) + '</div>'; });
  }
  function renderAdmin(d) {
    var w = document.getElementById('wrap');
    if (!d || !d.ok) { w.innerHTML = '<div class="card">讀取失敗</div>'; return; }
    if (!d.isAdmin) {
      w.innerHTML = '<div class="card"><h1>無檢視權限</h1>' +
        '<p class="muted">此頁僅限管理員。若你是主管，請把下面的 userId 填入「員工名冊」的 LINE_userId 欄，並把該員工設為經理／角色管理員：</p>' +
        '<div class="uid">' + esc(d.uid) + '</div></div>';
      return;
    }
    var s = d.stats;
    var html = '<h1>打卡狀況</h1><div class="date">' + esc(d.date) + '　' + esc(d.name) + '</div>';
    html += '<div class="stats">' + stat(s.active, '外業人員', '') + stat(s.inCount, '今日上班', '') +
      stat(s.outCount, '今日下班', '') + stat(s.pending, '待核准', 'bad') + '</div>';

    if (d.pending.length) {
      html += '<h2>待核准（' + d.pending.length + '）</h2>';
      d.pending.forEach(function (p) {
        var label = (p.method === '補打' ? '補打' : (p.method === '外勤自主' ? '外勤' : '定點')) + '・' + (p.punchType || '');
        var actions = p.canApprove
          ? '<div class="pbtns"><button class="approve" data-id="' + esc(p.recordId) + '" data-d="approve">核准</button>' +
            '<button class="reject" data-id="' + esc(p.recordId) + '" data-d="reject">退回</button></div>'
          : '<div class="muted" style="margin-top:6px">（待其直屬主管／人資核准）</div>';
        html += '<div class="arow pend"><div class="row"><b>' + esc(p.name) + '</b><span class="muted">' + esc(label) + '　' + esc(p.time) + '</span></div>' +
          '<div class="muted">' + esc(p.info || '') + '</div>' + actions + '</div>';
      });
    }

    html += '<h2>各工地出缺勤</h2>';
    html += '<select id="siteFilter"><option value="__all__">全部工地</option>';
    d.sites.forEach(function (g) { html += '<option value="' + esc(g.site) + '">' + esc(g.site) + '</option>'; });
    html += '</select>';

    d.sites.forEach(function (g) {
      html += '<div class="sitegrp" data-site="' + esc(g.site) + '"><h3>📍 ' + esc(g.site) + '</h3>' +
        '<table class="att"><tr><th>姓名</th><th>上班</th><th>下班</th></tr>';
      g.people.forEach(function (pp) {
        var miss = pp.in ? '' : ' class="miss"';
        html += '<tr' + miss + '><td class="nm">' + esc(pp.name) + '</td><td>' + esc(pp.in || '—') + '</td><td>' + esc(pp.out || '—') + '</td></tr>';
      });
      html += '</table></div>';
    });

    html += '<button class="refresh" id="refreshBtn">↻ 重新整理</button>';
    w.innerHTML = html;
    document.getElementById('refreshBtn').onclick = loadDashboard;
    Array.prototype.forEach.call(document.querySelectorAll('.pbtns button'), function (b) {
      b.onclick = function () { decide(b.getAttribute('data-id'), b.getAttribute('data-d')); };
    });
    var sf = document.getElementById('siteFilter');
    if (sf) sf.onchange = function () {
      var v = sf.value;
      Array.prototype.forEach.call(document.querySelectorAll('.sitegrp'), function (el) {
        el.style.display = (v === '__all__' || el.getAttribute('data-site') === v) ? '' : 'none';
      });
    };
  }
  function stat(n, label, cls) { return '<div class="stat ' + cls + '"><b>' + n + '</b><span>' + label + '</span></div>'; }
  function decide(recordId, decision) {
    post({ action: 'approve', idToken: me.idToken, recordId: recordId, decision: decision }).then(function (res) {
      if (!res.ok) { alert('操作失敗：' + (res.msg || '')); return; }
      loadDashboard();
    });
  }
</script>
</body>
</html>
